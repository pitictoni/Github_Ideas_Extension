<!-- AI Panel Overlay (click outside to close) -->
<div class="ai-panel-overlay" id="aiPanelOverlay"></div>

<!-- AI Assist Slide-in Panel -->
<div class="ai-assist-panel" id="aiAssistPanel">

    <!-- Header -->
    <div class="ai-panel-header">
        <div class="ai-panel-logo">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.58 26.58 0 0 0 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.933.933 0 0 1-.765.935c-.845.147-2.34.346-4.235.346-1.895 0-3.39-.2-4.235-.346A.933.933 0 0 1 3 9.219V8.062Z"/>
            </svg>
        </div>
        <div>
            <div class="ai-panel-title">AI Assistant</div>
            <div class="ai-panel-subtitle">Powered by Claude</div>
        </div>
        <div class="ai-panel-actions">
            <button class="ai-icon-btn" id="aiClearChatBtn" title="Clear conversation">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                </svg>
            </button>
            <button class="ai-icon-btn" id="aiPanelClose" title="Close">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- API Key Settings Row -->
    <div class="ai-settings-row">
        <span class="ai-settings-label">Key</span>
        <input type="password" id="aiApiKeyInput" placeholder="sk-ant-api03-…  (stored locally)" autocomplete="off" />
        <button class="ai-key-save-btn" id="aiKeySaveBtn">Save</button>
    </div>

    <!-- Active Context Badge -->
    <div class="ai-context-section">
        <div class="ai-quick-label" style="margin-bottom:5px;">CONTEXT</div>
        <div class="ai-context-badge ai-ctx-none" id="aiContextBadge">
            <span class="ai-ctx-empty">No context — select an issue, project, or gist</span>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="ai-quick-section">
        <div class="ai-quick-label">QUICK ACTIONS</div>
        <div class="ai-quick-actions" id="aiQuickActions">
            <!-- Rendered by ai-assist.js -->
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="ai-chat-messages" id="aiChatMessages">
        <!-- Populated dynamically -->
    </div>

    <!-- Input Footer -->
    <div class="ai-chat-footer">
        <div class="ai-input-wrapper">
            <textarea
                class="ai-chat-input"
                id="aiChatInput"
                placeholder="Ask anything about your issues, projects, or gists…"
                rows="1"
            ></textarea>
            <button class="ai-send-btn" id="aiSendBtn" title="Send (Enter)">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11zM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493z"/>
                </svg>
            </button>
        </div>
        <div class="ai-input-hint">Enter to send · Shift+Enter for newline</div>
    </div>
</div>
