<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Management</title>
    <link rel="stylesheet" href="css/popup.css">
</head>

<body>
    <div class="container">
        <!-- Header with theme toggle -->
        <div class="header">
            <div class="header-left">
                <div class="avatar-wrapper" id="avatarWrapper">
                    <img id="userAvatar" class="avatar header-avatar" src="" alt="User avatar">
                </div>
                <h2>GitHub Management</h2>
            </div>
            <div class="header-controls">

                <div class="theme-toggle">
                    <button class="theme-btn" id="themeToggleBtn" aria-label="Toggle theme">
                        <svg id="sunIcon" class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M6.76 4.84l-1.8-1.79L3.17 4.84l1.79 1.79 1.8-1.79zM1 13h3v-2H1v2zm10-9h2V1h-2v3zm7.04 1.05l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79zM17 13v-2h3v2h-3zM12 8a4 4 0 100 8 4 4 0 000-8zm4.24 9.16l1.8 1.79 1.79-1.79-1.79-1.79-1.8 1.79zM11 23h2v-3h-2v3zM4.22 19.78l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79z" />
                        </svg>
                        <svg id="moonIcon" class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                        </svg>
                    </button>
                </div>
                <button class="btn-icon" id="popoutBtn" title="Popout into a new window">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-circle-square" viewBox="0 0 16 16" style="cursor: pointer;" id="showPopup">
                        <path d="M0 6a6 6 0 1 1 12 0A6 6 0 0 1 0 6" />
                        <path d="M12.93 5h1.57a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-9a.5.5 
                        0 0 1-.5-.5v-1.57a7 7 0 0 1-1-.22v1.79A1.5 1.5 0 0 0 5.5 16h9a1.5 
                        1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 4h-1.79q.145.486.22 1" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Login View -->
        <div id="loginView" class="view">
            <div class="welcome-section">
                <svg class="github-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 
                    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 
                    2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 
                    0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.12 0 0 
                    .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 
                    1.53-1.04 2.2-.82 2.2-.82.44 1.11.16 1.92.08 2.12.51.56.82 
                    1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 
                    1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 
                    8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                </svg>
                <p class="welcome-text">Connect your GitHub account to manage your projects and gists.</p>
                <button class="btn btn-primary" id="loginBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 
                        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 
                        2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 
                        0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.12 0 0 
                        .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 
                        1.53-1.04 2.2-.82 2.2-.82.44 1.11.16 1.92.08 2.12.51.56.82 
                        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 
                        1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 
                        8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                    </svg>
                    Login with GitHub
                </button>
            </div>
        </div>

        <!-- Main View (after login) -->
        <div id="mainView" class="view hidden">
            <hr />

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="projects">Projects</button>
                <button class="tab-btn" data-tab="gists">Gists</button>
            </div>

            <!-- Projects Tab -->
            <div id="projectsTab" class="tab-content active">
                <div class="projects-container">
                    <!-- Repository Selection -->
                    <div class="project-header-section">
                        <label for="repoSelect" class="section-label">SELECT REPOSITORY</label>
                        <div class="select-row">
                            <select id="repoSelect" class="select">
                                <option value="" disabled selected>Select a repository</option>
                            </select>
                            <button class="btn-icon-refresh" id="refreshReposBtn" title="Refresh repositories">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                    fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
                                    <path
                                        d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Project Selection -->
                    <div id="projectSelectSection" class="project-header-section" style="display: none;">
                        <label for="projectSelect" class="section-label">SELECT PROJECT</label>
                        <div class="select-row">
                            <select id="projectSelect" class="select">
                                <option value="" disabled selected>Select a project</option>
                            </select>
                            <button class="btn-icon-refresh" id="refreshProjectsBtn" title="Refresh projects">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                    fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
                                    <path
                                        d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Project Issues Table -->
                    <div id="projectIssuesSection" class="project-issues-section" style="display: none;">
                        <div class="project-issues-header">
                            <h3 id="projectTitle">Project Issues</h3>
                            <button class="btn btn-secondary btn-sm" id="viewProjectBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16"
                                    fill="currentColor">
                                    <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 
                                0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                                -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 
                                2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 
                                0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.12 0 0 
                                .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 
                                1.53-1.04 2.2-.82 2.2-.82.44 1.11.16 1.92.08 2.12.51.56.82 
                                1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 
                                1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 
                                8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                                </svg>
                                View on GitHub
                            </button>
                        </div>
                        <div class="issues-table-container">
                            <table class="issues-table">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="issuesTableBody">
                                    <!-- Issues will be populated here -->
                                </tbody>
                            </table>
                            <div id="emptyIssuesState" class="empty-state" style="display: none;">
                                <p>No issues found in this project</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gists Tab -->
            <div id="gistsTab" class="tab-content">
                <div class="gists-container">
                    <!-- Gist Header -->
                    <div class="gist-header-section">
                        <div class="gist-select-actions">
                            <label for="gistSelect" class="section-label">MY GISTS</label>
                            <div class="gist-quick-actions">
                                <button class="btn btn-primary" id="createNewGistBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                        fill="currentColor">
                                        <path
                                            d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="gist-select-row">
                            <select id="gistSelect" class="select">
                                <option value="" disabled selected>Select a gist to view/edit</option>
                            </select>
                            <button class="btn-icon-refresh" id="refreshGistsBtn" title="Refresh gists">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                    fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
                                    <path
                                        d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Gist Preview (shows when a gist is selected) -->
                    <div id="gistPreview" class="gist-preview" style="display: none;">
                        <div class="gist-preview-header">
                            <h3 id="previewGistName">Gist Name</h3>
                            <div class="gist-preview-actions">
                                <button class="btn btn-secondary btn-sm" id="viewGistBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16"
                                        fill="currentColor">
                                        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 
                                    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                                    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 
                                    2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 
                                    0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.12 0 0 
                                    .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 
                                    1.53-1.04 2.2-.82 2.2-.82.44 1.11.16 1.92.08 2.12.51.56.82 
                                    1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 
                                    1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 
                                    8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                                    </svg>
                                    View on GitHub
                                </button>
                                <button class="btn btn-secondary btn-sm" id="renameGistBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16"
                                        fill="currentColor">
                                        <path
                                            d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                                        <path fill-rule="evenodd"
                                            d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
                                    </svg>
                                    Rename
                                </button>
                                <button class="btn btn-secondary btn-sm" id="editGistBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16"
                                        fill="currentColor">
                                        <path
                                            d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z" />
                                    </svg>
                                    Edit
                                </button>
                                <button class="btn btn-danger btn-sm" id="deleteGistBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16"
                                        fill="currentColor">
                                        <path
                                            d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z" />
                                        <path
                                            d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z" />
                                    </svg>
                                    Delete
                                </button>
                            </div>
                        </div>
                        <div class="gist-preview-body">
                            <div id="gistFilesList" class="gist-files-preview"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status message -->
    <div id="statusMessage" class="status-message hidden"></div>

    <!-- Create/Edit Gist Modal -->
    <div id="gistEditorModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="gistEditorModalTitle">Create New Gist</h3>
                <button class="modal-close" id="closeGistEditorModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-section">
                    <label for="gistDescription" class="section-label">DESCRIPTION (OPTIONAL)</label>
                    <input id="gistDescription" class="input" type="text" placeholder="What's this gist about?" />
                </div>

                <div class="editor-section">
                    <label for="gistFilename" class="section-label">FILENAME</label>
                    <input id="gistFilename" class="input" type="text" placeholder="my-notes.md" />
                </div>

                <div class="editor-section">
                    <label for="gistContent" class="section-label">CONTENT</label>
                    <textarea id="gistContent" class="textarea gist-textarea" placeholder="Write your notes here..."
                        rows="5"></textarea>
                </div>

                <div class="editor-section">
                    <label class="section-label">
                        <input type="checkbox" id="gistPublic" style="margin-right: 8px;">
                        Make this gist public
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelGistEditor">Cancel</button>
                <button class="btn btn-primary" id="saveGist">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z" />
                    </svg>
                    <span id="saveGistText">Create Gist</span>
                </button>
            </div>
        </div>
    </div>

    <!-- View/Edit Single File Modal -->
    <div id="fileEditorModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="fileEditorModalTitle">Edit File</h3>
                <button class="modal-close" id="closeFileEditorModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-section">
                    <label class="section-label">FILE: <span id="currentFileName"></span></label>
                    <select id="fileSelector" class="select" style="margin-top: 8px;">
                    </select>
                </div>

                <div class="editor-section">
                    <label for="fileContent" class="section-label">CONTENT</label>
                    <textarea id="fileContent" class="textarea gist-textarea" placeholder="File content..."
                        rows="5"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="renameFileBtn" style="margin-right: auto;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                        <path fill-rule="evenodd"
                            d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
                    </svg>
                    Rename File
                </button>
                <button class="btn btn-danger" id="deleteFileBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z" />
                        <path
                            d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z" />
                    </svg>
                    Delete File
                </button>
                <button class="btn btn-secondary" id="cancelFileEditor">Cancel</button>
                <button class="btn btn-primary" id="saveFileChanges">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                    </svg>
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Add New File Modal -->
    <div id="addFileModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New File</h3>
                <button class="modal-close" id="closeAddFileModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-section">
                    <label for="newFileName" class="section-label">FILENAME</label>
                    <input id="newFileName" class="input" type="text" placeholder="new-file.md" />
                </div>

                <div class="editor-section">
                    <label for="newFileContent" class="section-label">CONTENT</label>
                    <textarea id="newFileContent" class="textarea gist-textarea" placeholder="File content..."
                        rows="5"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelAddFile">Cancel</button>
                <button class="btn btn-primary" id="saveNewFile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z" />
                    </svg>
                    Add File
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-sm">
            <div class="modal-header" style="background-color: #dc3545;">
                <h3>Confirm Delete</h3>
                <button class="modal-close" id="closeDeleteConfirmModal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="deleteConfirmMessage">Are you sure you want to delete this item?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelDelete">Cancel</button>
                <button class="btn btn-danger" id="confirmDelete">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z" />
                        <path
                            d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z" />
                    </svg>
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Rename Gist Modal -->
    <div id="renameGistModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Rename Gist</h3>
                <button class="modal-close" id="closeRenameGistModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-section">
                    <label for="newGistDescription" class="section-label">GIST DESCRIPTION</label>
                    <input id="newGistDescription" class="input" type="text" placeholder="Enter new description" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelRenameGist">Cancel</button>
                <button class="btn btn-primary" id="confirmRenameGist">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                    </svg>
                    Rename
                </button>
            </div>
        </div>
    </div>

    <!-- Rename File Modal -->
    <div id="renameFileModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Rename File</h3>
                <button class="modal-close" id="closeRenameFileModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-section">
                    <label for="oldFilename" class="section-label">CURRENT FILENAME</label>
                    <input id="oldFilename" class="input" type="text" disabled />
                </div>
                <div class="editor-section">
                    <label for="newFilename" class="section-label">NEW FILENAME</label>
                    <input id="newFilename" class="input" type="text" placeholder="Enter new filename" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelRenameFile">Cancel</button>
                <button class="btn btn-primary" id="confirmRenameFile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">
                        <path
                            d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                    </svg>
                    Rename
                </button>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/popup.js"></script>
</body>

</html>
